[package]
name = "fifa-patch-extractor"
version = "0.0.0"  # not used: the app version lives only in tauri.conf.json
description = "FIFA Patch Extractor desktop app"
authors = ["Bruno Sajermann"]
license = "GPL-3.0-only"
repository = "https://github.com/Sajermann/fifa-patch-extractor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
